name: ci

on:
  push:
    branches: [main, solution-path]
  pull_request:
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: lab
          POSTGRES_DB: lab_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U lab" --health-interval 2s --health-retries 30
      rabbitmq:
        image: rabbitmq:4.4.0-management-alpine
        ports: ["5672:5672"]
        options: --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.33.1
        ports: ["1025:1025", "8025:8025"]
    env:
      TEST_DATABASE_URL: postgres://lab:lab@localhost:5432/lab_test
      TEST_AMQP_URL: amqp://guest:guest@localhost:5672
      TEST_SMTP_HOST: 127.0.0.1
      TEST_SMTP_PORT: "1025"
      TEST_MAILPIT_API: http://localhost:8025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # pnpm comes from corepack below; setup-node's auto cache would look for it first
          package-manager-cache: false
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Agent guard hooks
        run: pnpm test:guard
      - name: Safe jump
        run: pnpm test:jump
      - name: Every image pinned by digest
        run: sh scripts/check-digests.sh
      - name: Agent pointer files in sync with AGENTS.md
        run: sh scripts/agent-guard/sync-pointers.sh --check

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Loki stops ingesting when its disk is > 90 % full; the hosted runner is close
      # to that after building the images.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - run: make up
      - run: make verify N=0
      - name: Memory report (budget < 4 GB)
        if: always()
        run: |
          docker stats --no-stream --format '{{.Name}}\t{{.MemUsage}}' | tee mem.txt
          awk -F'\t' '{split($2,a," "); v=a[1]; if (v ~ /GiB/) {sub(/GiB/,"",v); v*=1024} else {sub(/MiB/,"",v)}; t+=v} END {printf "TOTAL %.0f MiB\n", t}' mem.txt | tee -a "$GITHUB_STEP_SUMMARY"

  # Every lab: verify must FAIL on lab-N-start and PASS on lab-N-solution (docs/04).
  labs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lab: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Loki stops ingesting when its disk is > 90 % full; the hosted runner is close
      # to that after building the images.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Debug logs for otel-lgtm internals (untracked override survives tag checkouts)
        run: |
          printf 'services:\n  lgtm:\n    environment:\n      ENABLE_LOGS_OTELCOL: "true"\n      ENABLE_LOGS_LOKI: "true"\n' > docker-compose.override.yml
      - name: Checkpoint tags exist
        id: tags
        run: |
          if git rev-parse -q --verify "refs/tags/lab-${{ matrix.lab }}-start" >/dev/null &&
             git rev-parse -q --verify "refs/tags/lab-${{ matrix.lab }}-solution" >/dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::lab-${{ matrix.lab }} tags not created yet — skipping"
          fi
      # A participant runs verify from lab-N-start: a fix to verify that only lands in
      # lab-N-solution would make correct solutions fail.
      - name: verify is the same at lab-${{ matrix.lab }}-start and -solution
        if: steps.tags.outputs.present == 'true'
        run: git diff --exit-code --stat "lab-${{ matrix.lab }}-start" "lab-${{ matrix.lab }}-solution" -- verify
      - name: lab-${{ matrix.lab }}-start must fail verify
        if: steps.tags.outputs.present == 'true'
        run: |
          git checkout -q "lab-${{ matrix.lab }}-start"
          sh scripts/apply-scenario.sh ${{ matrix.lab }}
          make up
          if make verify N=${{ matrix.lab }}; then
            echo "::error::verify passed on lab-${{ matrix.lab }}-start — the defect is missing"
            exit 1
          fi
      - name: lab-${{ matrix.lab }}-solution must pass verify
        if: steps.tags.outputs.present == 'true'
        run: |
          git checkout -q "lab-${{ matrix.lab }}-solution"
          sh scripts/apply-scenario.sh ${{ matrix.lab }}
          make up
          make verify N=${{ matrix.lab }}
      - name: Diagnostics
        if: failure()
        run: |
          df -h /
          docker compose ps
          for s in orders payments gateway otel-collector rabbitmq; do echo "::group::$s"; docker compose logs --tail 40 "$s"; echo "::endgroup::"; done
          echo "Loki services:"; docker compose exec -T lgtm curl -s http://127.0.0.1:3100/loki/api/v1/label/service_name/values; echo
          echo "::group::otel-lgtm internals (no query noise)"
          docker compose logs --no-log-prefix lgtm | grep -vE 'component=(querier|frontend)|executing query|start_delta|table_manager|query_hash' | grep -iE 'level=(warn|error)|throttl|shutting|refused|failed' | head -60
          echo "::endgroup::"
