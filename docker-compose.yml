name: otel-incident-lab

x-node-service: &node-service
  restart: unless-stopped
  env_file:
    - path: .env.scenario
      required: false
  environment: &node-env
    DATABASE_URL: postgres://lab:lab@postgres:5432/lab
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  depends_on: &node-deps
    postgres:
      condition: service_healthy
    otel-collector:
      condition: service_started

services:
  # ---------------------------------------------------------------- data
  postgres:
    image: postgres:17.11-alpine
    command: ["postgres", "-c", "max_connections=20"]
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------- faults
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.13.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    ports:
      - "8474:8474"
    volumes:
      - ./scenarios/toxiproxy.json:/config/toxiproxy.json:ro

  # ---------------------------------------------------------------- observability
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./observability/collector/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - lgtm

  lgtm:
    image: grafana/otel-lgtm:0.40.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - lgtm-data:/data
      - ./observability/grafana/provisioning/datasources/datasources.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/grafana-datasources.yaml:ro
      - ./observability/grafana/provisioning/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards:ro

  # ---------------------------------------------------------------- tools (on demand)
  loadgen:
    image: grafana/k6:2.3.0
    profiles: ["load"]
    restart: unless-stopped
    command: ["run", "--quiet", "/scripts/baseline.js"]
    environment:
      GATEWAY_URL: http://gateway:8080
    volumes:
      - ./loadgen:/scripts:ro

  k6:
    image: grafana/k6:2.3.0
    profiles: ["tools"]
    environment:
      GATEWAY_URL: http://gateway:8080
    volumes:
      - ./loadgen:/scripts:ro

  verify:
    build: ./verify
    image: otel-incident-lab/verify:local
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgres://lab:lab@postgres:5432/lab
      GATEWAY_URL: http://gateway:8080
      LOKI_URL: http://lgtm:3100
      TEMPO_URL: http://lgtm:3200
      PROMETHEUS_URL: http://lgtm:9090
      TOXIPROXY_URL: http://toxiproxy:8474
    volumes:
      - ./scenarios:/scenarios:ro

volumes:
  pg-data:
  lgtm-data:
